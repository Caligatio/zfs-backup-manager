[project]
name = "zfs-backup-manager"
version = "0.1.0"
description = "Python program which manages monthly, weekly, and daily backups using ZFS snapshots"
readme = "README.md"
requires-python = ">=3.9"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [
    { name = "Brian Turek", email = "brian.turek@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Archiving",
    "Topic :: System :: Archiving :: Backup",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "toml",
]

[project.urls]
Homepage = "https://github.com/Caligatio/zfs-backup-manager"

[project.scripts]
zfs_backup_manager = "zfs_backup_manager:cli"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
